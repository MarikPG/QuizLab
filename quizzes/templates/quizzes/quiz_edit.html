{% extends 'base.html' %}

{% block title %}Редагувати квіз | QuizLab{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 p-4">
            <h2 class="fw-bold mb-4">Редагувати налаштування квізу</h2>
            
            <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'quiz_manage' quiz.id %}" class="btn btn-outline-secondary">Скасувати</a>
                    <button type="submit" class="btn btn-primary px-4">Зберегти зміни</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
