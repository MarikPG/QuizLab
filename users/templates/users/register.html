{% extends 'base.html' %}

{% block title %}Реєстрація | QuizLab{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Реєстрація</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Зареєструватися</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Вже є акаунт? <a href="{% url 'login' %}">Увійти</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
