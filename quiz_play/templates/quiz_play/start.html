{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow p-4 text-center">
            <h2 class="fw-bold mb-3">{{ quiz.title }}</h2>
            <p class="text-muted">{{ quiz.description }}</p>
            
            <form method="post" class="mt-4 text-start">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="real_name" class="form-label fw-bold">Введіть ім'я:</label>
                    <input type="text" name="real_name" id="real_name" class="form-control" 
                           value="{% if user.is_authenticated %}{{ user.username }}{% endif %}" required placeholder="Наприклад: Марк">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mt-3">Розпочати тест</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
